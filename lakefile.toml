name = "openai_calderon"
defaultTargets = ["ComparatorChallenges", "Tests"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "f6090c7095e1e56b3464c1daba5f24631f1290d2"

[[lean_lib]]
name = "ComparatorChallenges"
globs = ["ComparatorChallenges.+"]

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]
